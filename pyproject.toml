[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fre_make_chatbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "llama-index-core",
  "llama-index-vector-stores-chroma",
  "llama-index-llms-ollama",
  "llama-index-embeddings-ollama",
  "llama-index-readers-file",
  "tree-sitter>=0.25.2",
  "tree-sitter-languages",
  "tree_sitter_language_pack",
  "chromadb",
  "streamlit",
  "requests",
  "pysqlite3-binary"
]
readme = "README.md"
description = "Draft version of FRE make 'mini' chatbot, based on LlamaIndex, Ollama, and Llama 3.1"
